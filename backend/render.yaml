services:
  - type: web
    name: mama-shopping-center-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: mama-supermarket-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: "admin@mamashoppingcenter.com"
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: mama-supermarket-db
    databaseName: mama_supermarket
    user: mama_admin
    region: frankfurt
    plan: free
