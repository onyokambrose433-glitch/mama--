<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mama Shopping Center | Fresh Supermarket & Groceries Delivered in Kampala</title>
    <meta name="description" content="Mama Shopping Center is Kampala's premier neighborhood supermarket. Fresh butcher meat, dairy, farm produce, bakery, and groceries delivered fast across Kampala & Entebbe." />
    
    <!-- Mobile App & PWA Meta Tags -->
    <meta name="theme-color" content="#E15712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mama Supermarket" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-500 selection:text-white pb-16 lg:pb-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // In local dev, avoid aggressive service worker caching
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.port === '')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
